services:
  frontend:
    build: /frontend
    ports:
      - "5173:5173"
    networks:
      - mern-network

  backend:
    build: /backend
    ports:
      - "5001:5001"
    networks:
      - mern-network
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - mern-network
    volumes:
      - mongo-data:/data/db

networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local