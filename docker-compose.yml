services:
  frontend:
    image: deanalemao/mern-frontend-employee:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mern-network
    restart: unless-stopped

  backend:
    image: deanalemao/mern-backend-employee:latest
    expose:
      - "5001"
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mern-network
    restart: uless-stopped

  mongo:
    image: mongo:7.0
    expose: 
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network
    healthcheck:
      test: ["CMD","mongosh","--eval","db.adminCommad('ping')"]
    restart: unless-stopped


networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
